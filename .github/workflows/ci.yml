name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/main.test.js imports the bundled main.js, which is gitignored,
      # so the build has to run before jest or that suite cannot resolve it.
      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: npm test
